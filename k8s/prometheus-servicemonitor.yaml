# ServiceMonitor for Prometheus Operator
# Prerequisite: Prometheus Operator is installed in the cluster! 
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-monitor
  namespace: notizen-app
  labels:
    app: api
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: "8000"
      path: /metrics
      interval: 30s
