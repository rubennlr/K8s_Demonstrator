apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: notizen-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: "notizen-api"
        static_configs:
          - targets: ["api:8000"]
        metrics_path: /metrics
